name: Validate Prasad Business app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all application JavaScript syntax
        run: |
          set -e
          for file in app.js backup-core.js erp.js compliance.js supplier-ledger.js tds-ca-handover.js dispatch.js advanced-workflows.js partial-dispatch.js contractor-payables.js fulfilment-quantity.js inventory-ledger.js dispatch-audit.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run fulfilment reservation functional tests
        run: node --test tests/fulfilment-quantity.test.cjs
      - name: Run stock ledger regression tests
        run: node --test tests/stock-ledgers.test.cjs
      - name: Run canonical inventory ledger tests
        run: node --test tests/inventory-ledger.test.cjs
      - name: Run dispatch stock reconciliation tests
        run: node --test tests/dispatch-audit.test.cjs

      - name: Run backup and restore safety tests
        run: node --test tests/backup-restore.test.cjs

      - name: Run invoice and dispatch print regression tests
        run: node --test tests/dispatch-print.test.cjs

      - name: Run end-to-end order-to-delivery regression tests
        run: node --test tests/order-to-delivery.test.cjs

      - name: Run procurement and supplier payables regression tests
        run: node --test tests/procurement-payables.test.cjs

      - name: Run supplier bill and TDS reconciliation tests
        run: node --test tests/supplier-bill-tds-reconciliation.test.cjs

      - name: Run customer collections and ageing regression tests
        run: node --test tests/customer-collections.test.cjs

      - name: Run month-end accounting checklist regression tests
        run: node --test tests/month-end-closing.test.cjs

      - name: Run bank reconciliation regression tests
        run: node --test tests/bank-reconciliation.test.cjs

      - name: Run mapped journal posting regression tests
        run: node --test tests/mapped-journal-posting.test.cjs

      - name: Run cheque register regression tests
        run: node --test tests/cheque-register.test.cjs

      - name: Run general expense voucher regression tests
        run: node --test tests/general-expenses.test.cjs
