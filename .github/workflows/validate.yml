name: Validate Prasad Business app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check all application JavaScript syntax
        run: |
          set -e
          for file in app.js erp.js compliance.js supplier-ledger.js tds-ca-handover.js; do
            echo "Checking $file"
            node --check "$file"
          done
